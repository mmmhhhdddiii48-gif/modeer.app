name: Build Generators Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/generators_mobile/**'
      - '.github/workflows/build-generators-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/generators_mobile/**'
      - 'build_patches_v2/**'
      - 'build_patches_v3/**'
      - 'build_patches_v4/**'
      - 'build_patches_v5/**'
      - 'build_patches_v6/**'
      - 'build_patches_v7/**'
      - 'build_patches_v8/**'
      - 'build_patches_v9/**'
      - '.github/workflows/build-generators-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    defaults:
      run:
        working-directory: mobile/generators_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Stage08 Batch01 source patch
        working-directory: .
        shell: bash
        run: |
          cat build_patches_v2/stage08_batch01_v2.patch.part* > /tmp/stage08_batch01.patch
          git apply --check /tmp/stage08_batch01.patch
          git apply /tmp/stage08_batch01.patch
          git diff --check

      - name: Apply Stage08 Batch02 source patch
        working-directory: .
        shell: bash
        run: |
          cat build_patches_v3/stage08_batch02.b64.part* | base64 --decode --ignore-garbage > /tmp/stage08_batch02.patch
          echo '40e2044f25ab34308593a1faa4acaea221a92f67440e7a5fcb250c939f4922b5  /tmp/stage08_batch02.patch' | sha256sum -c -
          git apply --check /tmp/stage08_batch02.patch
          git apply /tmp/stage08_batch02.patch
          git diff --check

      - name: Apply Stage08 Batch03 source patch
        working-directory: .
        shell: bash
        run: |
          base64 --decode --ignore-garbage build_patches_v4/stage08_batch03.patch.gz.b64 | gzip -dc > /tmp/stage08_batch03.patch
          echo '64cf70f661ba135af332db6648db2a98d901812cd33b08bb11ae19157012b590  /tmp/stage08_batch03.patch' | sha256sum -c -
          git apply --check /tmp/stage08_batch03.patch
          git apply /tmp/stage08_batch03.patch
          git diff --check

      - name: Apply Stage08 Batch04 source patch
        working-directory: .
        shell: bash
        run: |
          cat build_patches_v6/stage08_batch04.patch.gz.hex.part* > /tmp/stage08_batch04.patch.gz.hex
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/stage08_batch04.patch.gz.hex')
          target = Path('/tmp/stage08_batch04.patch.gz')
          target.write_bytes(bytes.fromhex(''.join(source.read_text(encoding='ascii').split())))
          PY
          echo 'e4e6c89fb4b9db485a6d3cd1fe0904c0dfe79d5c54532f0d41f7df5746c92fe1  /tmp/stage08_batch04.patch.gz' | sha256sum -c -
          gzip -dc /tmp/stage08_batch04.patch.gz > /tmp/stage08_batch04.patch
          echo '9a5500e8e3cfa36d34a1736765ad44dcaad8cc770dacb6f741e070140128f4b5  /tmp/stage08_batch04.patch' | sha256sum -c -
          git apply --check /tmp/stage08_batch04.patch
          git apply /tmp/stage08_batch04.patch
          git diff --check

      - name: Apply Stage08 Batch04 analyze correction
        working-directory: .
        shell: bash
        run: |
          echo '89e95bf0023aa42b9dac521af6173b821f0523952c16285ece26efe899668878  build_patches_v7/stage08_batch04_analyze_fix.patch' | sha256sum -c -
          git apply --check build_patches_v7/stage08_batch04_analyze_fix.patch
          git apply build_patches_v7/stage08_batch04_analyze_fix.patch
          git diff --check

      - name: Apply Stage08 Batch05 tracked source patch
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('build_patches_v8/stage08_batch05.patch.gz.hex')
          target = Path('/tmp/stage08_batch05.patch.gz')
          target.write_bytes(bytes.fromhex(''.join(source.read_text(encoding='ascii').split())))
          PY
          echo 'a4ebe975adb644fcd2145a26eff51aaef79e877f814bc43bfe73760fcfbd52f6  /tmp/stage08_batch05.patch.gz' | sha256sum -c -
          gzip -dc /tmp/stage08_batch05.patch.gz > /tmp/stage08_batch05.patch
          echo '7b2fcaed090b2df8de2191a6c12e7c85d407f4c626b490addb925c6957ff881b  /tmp/stage08_batch05.patch' | sha256sum -c -
          git apply --check /tmp/stage08_batch05.patch
          git apply /tmp/stage08_batch05.patch
          git diff --check

      - name: Apply Stage08 Batch05 new files correction
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('build_patches_v9/stage08_batch05_new_files.patch.gz.hex')
          target = Path('/tmp/stage08_batch05_new_files.patch.gz')
          target.write_bytes(bytes.fromhex(''.join(source.read_text(encoding='ascii').split())))
          PY
          echo '3ea42fd7cb9c92fd6a9663ad4b4b9a00beb8f7bdf5da46a403c1cec2df5ba9d8  /tmp/stage08_batch05_new_files.patch.gz' | sha256sum -c -
          gzip -dc /tmp/stage08_batch05_new_files.patch.gz > /tmp/stage08_batch05_new_files.patch
          echo '3fa619d3043d2ace6ca0e81ed35d238b25d6e3357f5d20145c25820f6135e553  /tmp/stage08_batch05_new_files.patch' | sha256sum -c -
          git apply --check /tmp/stage08_batch05_new_files.patch
          git apply /tmp/stage08_batch05_new_files.patch
          git diff --check

      - name: Run Batch01 to Batch05 source contracts
        working-directory: .
        run: node --test tests/generators_stage08_batch01_core_flow.test.js tests/generators_stage08_batch01_mobile_contract.test.js tests/generators_stage08_batch02_edit_dates_alerts_contract.test.js tests/generators_stage08_batch03_exit_load_contract.test.js tests/generators_stage08_batch04_receipt_printing_contract.test.js tests/generators_stage08_batch05_activation_variants_contract.test.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform
        shell: bash
        run: |
          flutter create . --project-name nukhba_generators_mobile --org com.nukhba --platforms=android
          rm -f test/widget_test.dart

      - name: Configure Android release basics and permissions
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi
          python - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />',
          ]
          missing = [line for line in permissions if line.split('android:name="', 1)[1].split('"', 1)[0] not in text]
          if missing:
              end = text.find('>') + 1
              text = text[:end] + '\n' + '\n'.join(missing) + text[end:]
              manifest.write_text(text, encoding='utf-8')
          PY

      - name: Get Flutter packages
        run: flutter pub get

      - name: Format Flutter build workspace
        run: dart format lib test

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Create Android vector launcher icons
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/nukhba_owner_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#081C24" android:pathData="M0,0h108v108h-108z" />
            <path android:fillColor="#24B8B1" android:pathData="M22,66h13v20h-13zM42,51h13v35h-13zM62,34h13v52h-13z" />
            <path android:fillColor="#F28C28" android:pathData="M30,53l9,-9l12,12l28,-29l9,9l-37,38z" />
          </vector>
          XML
          cat > android/app/src/main/res/drawable/nukhba_collector_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#081C24" android:pathData="M0,0h108v108h-108z" />
            <path android:fillColor="#24B8B1" android:pathData="M22,61h13v19h-13zM42,47h13v33h-13zM62,31h13v49h-13z" />
            <path android:fillColor="#F28C28" android:pathData="M30,49l9,-9l12,12l28,-29l9,9l-37,38zM0,88h108v20h-108z" />
          </vector>
          XML

      - name: Configure Owner Android identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          gradle = Path('android/app/build.gradle.kts')
          if not gradle.exists():
              gradle = Path('android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.nukhba.generators.owner"', text)
          text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.nukhba.generators.owner"', text)
          gradle.write_text(text, encoding='utf-8')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          mtext = manifest.read_text(encoding='utf-8')
          mtext = re.sub(r'android:label="[^"]+"', 'android:label="النخبة للمولدات"', mtext, count=1)
          mtext = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/nukhba_owner_launcher"', mtext, count=1)
          manifest.write_text(mtext, encoding='utf-8')
          PY

      - name: Build Owner release APK
        run: flutter build apk --release --dart-define=APP_VARIANT=owner

      - name: Preserve Owner APK
        shell: bash
        run: |
          mkdir -p build/stage08_batch05
          cp build/app/outputs/flutter-apk/app-release.apk build/stage08_batch05/Nukhba_Generators_Owner_Stage08_Batch05.apk

      - name: Configure Collector Android identity
        shell: bash
        run: |
          flutter clean
          flutter pub get
          python - <<'PY'
          from pathlib import Path
          import re
          gradle = Path('android/app/build.gradle.kts')
          if not gradle.exists():
              gradle = Path('android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.nukhba.generators.collector"', text)
          text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.nukhba.generators.collector"', text)
          gradle.write_text(text, encoding='utf-8')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          mtext = manifest.read_text(encoding='utf-8')
          mtext = re.sub(r'android:label="[^"]+"', 'android:label="النخبة للجابي"', mtext, count=1)
          mtext = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/nukhba_collector_launcher"', mtext, count=1)
          manifest.write_text(mtext, encoding='utf-8')
          PY

      - name: Build Collector release APK
        run: flutter build apk --release --dart-define=APP_VARIANT=collector

      - name: Package APKs and checksums
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/stage08_batch05/Nukhba_Generators_Collector_Stage08_Batch05.apk
          cd build/stage08_batch05
          sha256sum Nukhba_Generators_Owner_Stage08_Batch05.apk > Nukhba_Generators_Owner_Stage08_Batch05_SHA256.txt
          sha256sum Nukhba_Generators_Collector_Stage08_Batch05.apk > Nukhba_Generators_Collector_Stage08_Batch05_SHA256.txt
          sha256sum Nukhba_Generators_*_Stage08_Batch05.apk > Nukhba_Generators_Stage08_Batch05_All_SHA256.txt

      - name: Upload Owner and Collector APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nukhba-Generators-Stage08-Batch05
          path: |
            mobile/generators_mobile/build/stage08_batch05/Nukhba_Generators_Owner_Stage08_Batch05.apk
            mobile/generators_mobile/build/stage08_batch05/Nukhba_Generators_Collector_Stage08_Batch05.apk
            mobile/generators_mobile/build/stage08_batch05/Nukhba_Generators_Owner_Stage08_Batch05_SHA256.txt
            mobile/generators_mobile/build/stage08_batch05/Nukhba_Generators_Collector_Stage08_Batch05_SHA256.txt
            mobile/generators_mobile/build/stage08_batch05/Nukhba_Generators_Stage08_Batch05_All_SHA256.txt
          if-no-files-found: error
          retention-days: 30
