name: Build Generators Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/generators_mobile/**'
      - '.github/workflows/build-generators-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: mobile/generators_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform
        run: flutter create . --project-name nukhba_generators_mobile --org com.nukhba --platforms=android

      - name: Set Android minimum SDK 24
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Nukhba_Generators_v0.7.0.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Nukhba-Generators-Android-v0.7.0
          path: mobile/generators_mobile/build/app/outputs/flutter-apk/Nukhba_Generators_v0.7.0.apk
          if-no-files-found: error
          retention-days: 30
