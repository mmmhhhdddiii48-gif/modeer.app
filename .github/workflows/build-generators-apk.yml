name: Build Generators Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/generators_mobile/**'
      - '.github/workflows/build-generators-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/generators_mobile/**'
      - 'build_patches_v2/**'
      - 'build_patches_v3/**'
      - 'build_patches_v4/**'
      - '.github/workflows/build-generators-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: mobile/generators_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Stage08 Batch01 source patch
        working-directory: .
        shell: bash
        run: |
          cat build_patches_v2/stage08_batch01_v2.patch.part* > /tmp/stage08_batch01.patch
          git apply --check /tmp/stage08_batch01.patch
          git apply /tmp/stage08_batch01.patch
          git diff --check

      - name: Apply Stage08 Batch02 source patch
        working-directory: .
        shell: bash
        run: |
          cat build_patches_v3/stage08_batch02.b64.part* | base64 --decode --ignore-garbage > /tmp/stage08_batch02.patch
          echo '40e2044f25ab34308593a1faa4acaea221a92f67440e7a5fcb250c939f4922b5  /tmp/stage08_batch02.patch' | sha256sum -c -
          git apply --check /tmp/stage08_batch02.patch
          git apply /tmp/stage08_batch02.patch
          git diff --check

      - name: Apply Stage08 Batch03 source patch
        working-directory: .
        shell: bash
        run: |
          base64 --decode --ignore-garbage build_patches_v4/stage08_batch03.patch.gz.b64 | gzip -dc > /tmp/stage08_batch03.patch
          echo '64cf70f661ba135af332db6648db2a98d901812cd33b08bb11ae19157012b590  /tmp/stage08_batch03.patch' | sha256sum -c -
          git apply --check /tmp/stage08_batch03.patch
          git apply /tmp/stage08_batch03.patch
          git diff --check

      - name: Run Batch01 to Batch03 source contracts
        working-directory: .
        run: node --test tests/generators_stage08_batch01_core_flow.test.js tests/generators_stage08_batch01_mobile_contract.test.js tests/generators_stage08_batch02_edit_dates_alerts_contract.test.js tests/generators_stage08_batch03_exit_load_contract.test.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform
        shell: bash
        run: |
          flutter create . --project-name nukhba_generators_mobile --org com.nukhba --platforms=android
          rm -f test/widget_test.dart

      - name: Configure Android release basics
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi
          manifest='android/app/src/main/AndroidManifest.xml'
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
          fi

      - name: Get Flutter packages
        run: flutter pub get

      - name: Format Flutter build workspace
        run: dart format lib test

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK and checksum
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Nukhba_Generators_Stage08_Batch03.apk
          cd build/app/outputs/flutter-apk
          sha256sum Nukhba_Generators_Stage08_Batch03.apk > Nukhba_Generators_Stage08_Batch03_SHA256.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Nukhba-Generators-Stage08-Batch03
          path: |
            mobile/generators_mobile/build/app/outputs/flutter-apk/Nukhba_Generators_Stage08_Batch03.apk
            mobile/generators_mobile/build/app/outputs/flutter-apk/Nukhba_Generators_Stage08_Batch03_SHA256.txt
          if-no-files-found: error
          retention-days: 30
